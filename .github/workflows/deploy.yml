name: Docker Build and Push

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  ENVIRONMENT: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && 'production' || 'preview' }}

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.13.0"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        env:
          # The committed .npmrc uses this only to install GitHub Packages.
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build and smoke without platform configuration
        run: npm run test:smoke
        timeout-minutes: 10

      - name: Report failed pre-image checks
        if: failure()
        run: |
          echo "::error::Pre-image checks failed; no new image will be built or pushed."
          echo "Pre-image checks failed. The previous image remains unchanged; inspect the failed check above." >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=pr-${{ github.event.number }}-{{date 'YYYYMMDDHHmmss'}},enable=${{ github.event_name == 'pull_request' }}
            type=raw,value=edge-{{date 'YYYYMMDDHHmmss'}},enable={{is_default_branch}}

      - name: Build and push Docker images
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Available only during the Dockerfile's dependency-install step.
          secrets: |
            node_auth_token=${{ secrets.GITHUB_TOKEN }}
          # appthrust.dev runtimes are linux/amd64. Adding linux/arm64 here builds
          # under QEMU emulation and multiplied build time (166s -> 39s measured on
          # a Next.js app after removing it). For an arm64 runtime, build natively
          # on an ubuntu-24.04-arm runner and merge manifests instead.
          platforms: linux/amd64

      - name: Generate comment content
        id: comment
        run: |
          COMMENT_BODY="**🐳 Docker images built and pushed to GitHub Container Registry**

          <details>
          <summary>🏷️ View image tags and details</summary>

          **Available Image Tags**
          \`\`\`
          ${{ steps.meta.outputs.tags }}
          \`\`\`

          </details>"
          {
            echo "body<<EOF"
            echo "$COMMENT_BODY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Add comment to commit
        uses: peter-evans/commit-comment@v3
        with:
          body: ${{ steps.comment.outputs.body }}

      - name: Add comment to pull request (if applicable)
        if: github.event_name == 'pull_request'
        uses: thollander/actions-comment-pull-request@v2
        with:
          comment_tag: image_tags
          message: ${{ steps.comment.outputs.body }}
